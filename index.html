<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f1eaff">
<title>HAPPY BIRTHDAY</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#fff}
  body{font-family:system-ui,sans-serif}
  .art{position:relative;width:100%;overflow:hidden}
  .art svg{display:block;width:100%;height:auto}
  .hot{position:absolute;display:block;z-index:5;background:transparent;-webkit-tap-highlight-color:transparent}
  .hot:focus-visible{outline:2px solid rgba(0,0,0,.45);outline-offset:2px;border-radius:999px}

  /* Exact Affinity artwork on desktop/tablet. */
  .desktop{display:block;max-width:1600px;margin:0 auto}

  /* Reuses the same source artwork in cropped sections on phones. */
  .mobile{display:none;background:#fff}
  .mobile .section{position:relative;overflow:hidden}
  .mobile svg{display:block;width:100%;height:auto}
  .mobile .header{margin:0}
  .mobile .route{margin:0}
  .mobile .rows{padding:0 10px 8px}
  .mobile .row{margin:0}
  .mobile .note{margin:0}

  @media (max-width:700px){
    .desktop{display:none}
    .mobile{display:block}
  }

  /* Desktop hotspots, coordinates based on the original 1600 × 720 artboard. */
  .desktop .A {left:2.6%;top:31.0%;width:4.3%;height:8.8%}
  .desktop .P1{left:9.8%;top:35.0%;width:3.4%;height:6.5%}
  .desktop .P2{left:29.8%;top:34.0%;width:3.4%;height:6.5%}
  .desktop .P3{left:54.4%;top:33.9%;width:3.4%;height:6.5%}
  .desktop .P4{left:84.0%;top:42.7%;width:3.4%;height:6.5%}
  .desktop .P5{left:91.0%;top:45.0%;width:3.4%;height:6.5%}
  .desktop .B {left:92.6%;top:49.0%;width:4.6%;height:8.8%}
  .desktop .C1{left:6.7%;top:58.5%;width:19.0%;height:6.2%}
  .desktop .C2{left:6.7%;top:66.0%;width:19.0%;height:6.2%}
  .desktop .C3{left:6.7%;top:73.4%;width:19.0%;height:6.2%}
  .desktop .C4{left:6.7%;top:80.8%;width:19.0%;height:6.2%}
  .desktop .C5{left:6.7%;top:88.2%;width:19.0%;height:6.2%}

  /* Mobile header is cropped from the original SVG: viewBox 35 25 930 105 */
  .mh{aspect-ratio:930/105}

  /* Mobile route: full original route region, same vector curves and pin artwork. */
  .mr{aspect-ratio:1540/250}
  .mr .A {left:0.7%;top:27%;width:8%;height:46%}
  .mr .P1{left:8.1%;top:36%;width:7%;height:40%}
  .mr .P2{left:28.8%;top:34%;width:7%;height:40%}
  .mr .P3{left:54.2%;top:32%;width:7%;height:40%}
  .mr .P4{left:84.5%;top:55%;width:7%;height:40%}
  .mr .P5{left:91.0%;top:63%;width:7%;height:36%}
  .mr .B {left:94.0%;top:69%;width:6%;height:31%}

  /* Each stop row is another crop of the exact original vector artwork. */
  .mrow{aspect-ratio:760/62}
  .mrow .pin{left:0%;top:0;width:10%;height:100%}
  .mrow .coord{left:8%;top:0;width:47%;height:100%}

  .mn{aspect-ratio:610/52}

  /* Optional business-name reveal. This sits above the original artwork;
     the Affinity SVG itself remains completely unchanged. */
  .business-toggle{
    position:fixed;
    z-index:30;
    top:max(10px,env(safe-area-inset-top));
    right:max(10px,env(safe-area-inset-right));
    border:1px solid rgba(84,64,115,.22);
    border-radius:999px;
    padding:8px 12px;
    background:rgba(255,255,255,.90);
    color:rgb(84,64,115);
    box-shadow:0 2px 10px rgba(0,0,0,.10);
    font:600 13px/1.1 system-ui,-apple-system,"Segoe UI",sans-serif;
    cursor:pointer;
    backdrop-filter:blur(7px);
    -webkit-backdrop-filter:blur(7px);
  }
  .business-toggle:focus-visible{
    outline:2px solid rgb(84,64,115);
    outline-offset:2px;
  }

  .business-label{
    position:absolute;
    z-index:12;
    display:none;
    max-width:190px;
    padding:3px 7px 4px;
    border-radius:8px;
    background:rgba(255,255,255,.90);
    color:rgb(84,64,115);
    box-shadow:0 1px 6px rgba(0,0,0,.10);
    font-family:"Gabriola","Segoe Print","Bradley Hand",cursive;
    font-size:clamp(14px,1.2vw,21px);
    line-height:1.05;
    white-space:nowrap;
    pointer-events:none;
  }
  body.show-businesses .business-label{display:block}

  /* Desktop/tablet name positions relative to the 1600 × 720 artwork. */
  .desktop .L1{left:12.8%;top:31.2%}
  .desktop .L2{left:32.6%;top:30.0%}
  .desktop .L3{left:57.2%;top:29.8%}
  .desktop .L4{right:15.0%;top:37.3%}
  .desktop .L5{right:6.4%;top:48.7%}

  /* Phone name positions relative to the cropped route section. */
  .mr .L1{left:12.4%;top:18%}
  .mr .L2{left:32.5%;top:15%}
  .mr .L3{left:57.3%;top:14%}
  .mr .L4{right:10.8%;top:36%}
  .mr .L5{right:2.5%;top:78%}

  @media(max-width:700px){
    .business-toggle{
      top:max(7px,env(safe-area-inset-top));
      right:max(7px,env(safe-area-inset-right));
      padding:7px 10px;
      font-size:12px;
    }
    .business-label{
      max-width:145px;
      padding:2px 5px 3px;
      border-radius:6px;
      font-size:11px;
    }
  }



  /* Visible interaction feedback for the invisible map hotspots. */
  .hot{
    transition:transform .14s ease, background-color .14s ease, box-shadow .14s ease, outline-color .14s ease;
    transform-origin:center center;
    border-radius:10px;
    cursor:pointer;
  }
  .hot:hover,
  .hot:focus-visible{
    transform:scale(1.14);
    background:rgba(255,255,255,.22);
    box-shadow:0 0 0 2px rgba(255,255,255,.38), 0 3px 10px rgba(0,0,0,.13);
    z-index:24;
  }

  /* Pin/end-point hotspots should read as a circular enlargement/halo. */
  .A,.B,.P1,.P2,.P3,.P4,.P5,.pin{
    border-radius:999px;
  }
  .A:hover,.B:hover,.P1:hover,.P2:hover,.P3:hover,.P4:hover,.P5:hover,.pin:hover,
  .A:focus-visible,.B:focus-visible,.P1:focus-visible,.P2:focus-visible,.P3:focus-visible,.P4:focus-visible,.P5:focus-visible,.pin:focus-visible{
    background:rgba(255,255,255,.14);
    box-shadow:0 0 0 3px rgba(255,255,255,.52), 0 3px 10px rgba(0,0,0,.14);
  }

  /* Coordinate links get a clear but restrained hover plate. */
  .C1,.C2,.C3,.C4,.C5,.coord{
    border-radius:8px;
  }

  .business-toggle{
    transition:transform .14s ease, box-shadow .14s ease;
    transform-origin:center;
  }
  .business-toggle:hover,
  .business-toggle:focus-visible{
    transform:scale(1.07);
    box-shadow:0 4px 14px rgba(0,0,0,.16);
  }

  @media (hover:none){
    .hot:hover{transform:none;background:transparent;box-shadow:none}
    .business-toggle:hover{transform:none}
  }
  @media (prefers-reduced-motion:reduce){
    .hot,.business-toggle{transition:none}
  }


  /* Route-pin hover: enlarge the actual coloured pin, centred on the
     pin artwork rather than on the larger invisible click target. */
  .desktop .P1,.desktop .P2,.desktop .P3,.desktop .P4,.desktop .P5,
  .mr .P1,.mr .P2,.mr .P3,.mr .P4,.mr .P5{
    overflow:visible;
    background:transparent !important;
    box-shadow:none !important;
    transform:none !important;
  }

  .desktop .P1::after,.desktop .P2::after,.desktop .P3::after,.desktop .P4::after,.desktop .P5::after,
  .mr .P1::after,.mr .P2::after,.mr .P3::after,.mr .P4::after,.mr .P5::after{
    content:attr(data-pin);
    position:absolute;
    left:50%;
    top:50%;
    width:72%;
    aspect-ratio:1;
    border-radius:50%;
    display:grid;
    place-items:center;
    box-sizing:border-box;
    background:rgb(238,204,149);
    border:2px solid rgb(17,17,17);
    color:rgb(17,17,17);
    font-family:"Gabriola","Segoe Print","Bradley Hand",cursive;
    font-size:clamp(13px,1.15vw,19px);
    line-height:1;
    opacity:0;
    transform:translate(-50%,-50%) scale(1);
    transform-origin:center;
    transition:opacity .11s ease, transform .14s ease;
    pointer-events:none;
    z-index:2;
  }

  .desktop .P1:hover::after,.desktop .P2:hover::after,.desktop .P3:hover::after,.desktop .P4:hover::after,.desktop .P5:hover::after,
  .desktop .P1:focus-visible::after,.desktop .P2:focus-visible::after,.desktop .P3:focus-visible::after,.desktop .P4:focus-visible::after,.desktop .P5:focus-visible::after,
  .mr .P1:hover::after,.mr .P2:hover::after,.mr .P3:hover::after,.mr .P4:hover::after,.mr .P5:hover::after,
  .mr .P1:focus-visible::after,.mr .P2:focus-visible::after,.mr .P3:focus-visible::after,.mr .P4:focus-visible::after,.mr .P5:focus-visible::after{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.34);
  }

  /* Exact centres measured from the Affinity artwork (1600 × 720 artboard). */
  .desktop .P1{left:9.35%;top:35.43%;width:3.40%;height:7.86%}
  .desktop .P2{left:29.03%;top:34.76%;width:3.40%;height:7.86%}
  .desktop .P3{left:53.65%;top:34.56%;width:3.40%;height:7.86%}
  .desktop .P4{left:83.42%;top:42.69%;width:3.40%;height:7.86%}
  .desktop .P5{left:90.27%;top:45.55%;width:3.40%;height:7.86%}

  /* Same exact centres translated into the mobile route crop
     (viewBox 30 185 1540 250). */
  .mr .P1{left:7.77%;top:28.94%;width:5.20%;height:37.0%}
  .mr .P2{left:28.18%;top:27.07%;width:5.20%;height:37.0%}
  .mr .P3{left:53.74%;top:26.48%;width:5.20%;height:37.0%}
  .mr .P4{left:84.72%;top:48.33%;width:5.20%;height:37.0%}
  .mr .P5{left:91.82%;top:56.57%;width:5.20%;height:37.0%}

  /* Revealed business names are links. Keep the same appearance, but make
     their interactivity obvious on hover/focus. */
  .business-label{
    pointer-events:auto;
    text-decoration:none;
    cursor:pointer;
    transition:transform .13s ease, box-shadow .13s ease;
    transform-origin:center;
  }
  .business-label:hover,
  .business-label:focus-visible{
    transform:scale(1.07);
    box-shadow:0 3px 10px rgba(0,0,0,.16);
    outline:none;
  }

  @media (hover:none){
    .desktop .P1:hover::after,.desktop .P2:hover::after,.desktop .P3:hover::after,.desktop .P4:hover::after,.desktop .P5:hover::after,
    .mr .P1:hover::after,.mr .P2:hover::after,.mr .P3:hover::after,.mr .P4:hover::after,.mr .P5:hover::after{
      opacity:0;
      transform:translate(-50%,-50%) scale(1);
    }
    .business-label:hover{transform:none}
  }

  @media (prefers-reduced-motion:reduce){
    .desktop .P1::after,.desktop .P2::after,.desktop .P3::after,.desktop .P4::after,.desktop .P5::after,
    .mr .P1::after,.mr .P2::after,.mr .P3::after,.mr .P4::after,.mr .P5::after,
    .business-label{transition:none}
  }


  /* A/B endpoint hover — same treatment as pins 1–5:
     enlarge the coloured endpoint itself, centred on the artwork. */
  .desktop .A,.desktop .B,
  .mr .A,.mr .B{
    overflow:visible;
    background:transparent !important;
    box-shadow:none !important;
    transform:none !important;
  }

  .desktop .A::after,.desktop .B::after,
  .mr .A::after,.mr .B::after{
    position:absolute;
    left:50%;
    top:50%;
    width:78%;
    aspect-ratio:1;
    border-radius:50%;
    display:grid;
    place-items:center;
    box-sizing:border-box;
    background:rgb(185,215,125);
    border:2px solid rgb(17,17,17);
    color:rgb(17,17,17);
    font-family:"Gabriola","Segoe Print","Bradley Hand",cursive;
    font-size:clamp(18px,1.55vw,27px);
    line-height:1;
    opacity:0;
    transform:translate(-50%,-50%) scale(1);
    transform-origin:center;
    transition:opacity .11s ease, transform .14s ease;
    pointer-events:none;
    z-index:2;
  }
  .desktop .A::after,.mr .A::after{content:"A"}
  .desktop .B::after,.mr .B::after{content:"B"}

  .desktop .A:hover::after,.desktop .B:hover::after,
  .desktop .A:focus-visible::after,.desktop .B:focus-visible::after,
  .mr .A:hover::after,.mr .B:hover::after,
  .mr .A:focus-visible::after,.mr .B:focus-visible::after{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.30);
  }

  @media (hover:none){
    .desktop .A:hover::after,.desktop .B:hover::after,
    .mr .A:hover::after,.mr .B:hover::after{
      opacity:0;
      transform:translate(-50%,-50%) scale(1);
    }
  }


  /* Fine-tune B hover alignment to the actual endpoint artwork. */
  .desktop .B::after{ left:46%; top:46%; }
  .mr .B::after{ left:46%; top:46%; }


  /* B endpoint: exact visual replacement on hover.
     Oversized enough to fully cover the original green pin underneath. */
  .desktop .B::after,
  .mr .B::after{
    left:42% !important;
    top:46% !important;
    width:92% !important;
    border-width:2px !important;
  }

  .desktop .B:hover::after,
  .desktop .B:focus-visible::after,
  .mr .B:hover::after,
  .mr .B:focus-visible::after{
    opacity:1 !important;
    transform:translate(-50%,-50%) scale(1.30) !important;
  }


  /* B hover aligned to the actual green B circle in the source SVG.
     Diameter is matched to A's hovered diameter, not enlarged to hide errors. */

  /* Desktop:
     actual B centre = 93.656% x, 53.889% y of the 1600×720 artwork.
     B hotspot = left 92.6%, top 49.0%, width 4.6%, height 8.8%.
     Therefore the visual centre inside that hotspot is ~23.0% / 55.6%.
     Width 72.9% gives the same absolute diameter as A's 78% of its 4.3%-wide hotspot. */
  .desktop .B::after{
    left:23.0% !important;
    top:55.6% !important;
    width:72.9% !important;
  }

  /* Mobile route crop:
     actual B centre translated into viewBox 30 185 1540 250 = 95.36% / 81.2%.
     B hotspot = left 94%, top 69%, width 6%, height 31%.
     This places the replacement at ~22.6% / 39.4% inside the hotspot.
     Width 104% matches A's absolute hovered diameter (78% of an 8%-wide hotspot). */
  .mr .B::after{
    left:22.6% !important;
    top:39.4% !important;
    width:104% !important;
  }

  /* Use exactly the same hover scale as A. */
  .desktop .B:hover::after,
  .desktop .B:focus-visible::after,
  .mr .B:hover::after,
  .mr .B:focus-visible::after{
    opacity:1 !important;
    transform:translate(-50%,-50%) scale(1.30) !important;
  }


  .gift-toggle{
    position:fixed;
    z-index:30;
    top:calc(max(10px,env(safe-area-inset-top)) + 43px);
    right:max(10px,env(safe-area-inset-right));
    border:1px solid rgba(84,64,115,.22);
    border-radius:999px;
    padding:8px 12px;
    background:rgba(255,255,255,.90);
    color:rgb(84,64,115);
    box-shadow:0 2px 10px rgba(0,0,0,.10);
    font:600 13px/1.1 system-ui,-apple-system,"Segoe UI",sans-serif;
    cursor:pointer;
    backdrop-filter:blur(7px);
    -webkit-backdrop-filter:blur(7px);
    transition:transform .14s ease,box-shadow .14s ease;
  }
  .gift-toggle:hover,.gift-toggle:focus-visible{
    transform:scale(1.07);
    box-shadow:0 4px 14px rgba(0,0,0,.16);
    outline:none;
  }

  .restore-gift{
    position:absolute;
    z-index:25;
    display:none;
    align-items:center;
    justify-content:center;
    color:rgb(84,64,115);
    text-decoration:none;
    font-family:"Gabriola","Segoe Print","Bradley Hand",cursive;
    font-weight:700;
    line-height:1;
    white-space:nowrap;
    border-radius:5px;
    padding:1px 3px 2px;
    background:rgba(255,255,255,.82);
    box-shadow:0 1px 5px rgba(0,0,0,.08);
    cursor:pointer;
    transform-origin:center;
    transition:transform .13s ease,box-shadow .13s ease,background-color .13s ease;
  }
  body.show-gift .restore-gift{display:flex}
  .restore-gift:hover,.restore-gift:focus-visible{
    transform:scale(1.12);
    background:rgba(255,255,255,.97);
    box-shadow:0 3px 10px rgba(0,0,0,.16);
    text-decoration:underline;
    text-decoration-thickness:2px;
    outline:none;
  }

  /* Positioned over the word "Restore" in stop 5. */
  .desktop .restore-gift{
    left:28.6%;
    top:88.0%;
    font-size:clamp(15px,1.2vw,21px);
  }
  .mrow5 .restore-gift{
    left:55.5%;
    top:17%;
    font-size:17px;
  }

  @media(max-width:700px){
    .gift-toggle{
      top:calc(max(7px,env(safe-area-inset-top)) + 39px);
      right:max(7px,env(safe-area-inset-right));
      padding:7px 10px;
      font-size:12px;
    }
  }
  @media(hover:none){
    .gift-toggle:hover{transform:none}
    .restore-gift:hover{transform:none}
  }


  /* Refined Restore gift interaction */
  .restore-gift{
    display:flex !important;
    background:transparent !important;
    box-shadow:none !important;
    color:transparent !important;
    text-decoration:none !important;
    padding:0 !important;
    align-items:center;
    justify-content:center;
  }

  .restore-gift::before{
    content:"Restore";
    color:rgb(84,64,115);
    font-family:"Gabriola","Segoe Print","Bradley Hand",cursive;
    font-weight:700;
    line-height:1;
    white-space:nowrap;
    opacity:0;
    transform:scale(1);
    transition:opacity .10s ease,transform .13s ease;
    pointer-events:none;
  }

  /* Hovering the original Restore word reveals its bold linked version,
     even when the Gift button has not been selected. */
  .restore-gift:hover::before,
  .restore-gift:focus-visible::before,
  body.show-gift .restore-gift::before{
    opacity:1;
    transform:scale(1.08);
  }

  .restore-gift:hover,
  .restore-gift:focus-visible{
    transform:none !important;
    background:transparent !important;
    box-shadow:none !important;
    outline:none;
  }

  /* Tight hitboxes positioned directly over the original word. */
  .desktop .restore-gift{
    left:28.55% !important;
    top:88.55% !important;
    width:5.9%;
    height:4.5%;
    font-size:clamp(15px,1.2vw,21px);
  }
  .mrow5 .restore-gift{
    left:55.0% !important;
    top:8% !important;
    width:15.2%;
    height:84%;
    font-size:17px;
  }


  /* Restore hover: replace the original word visually with a larger bold version. */
  .restore-gift{
    overflow:visible !important;
  }

  .restore-gift::before{
    position:absolute;
    left:50%;
    top:50%;
    content:"Restore";

  }

  /* Fine alignment so the bold replacement sits exactly over the artwork word. */
  .desktop .restore-gift::before{
    top:54%;
  }
  .mrow5 .restore-gift::before{
    top:52%;
  }


  /* Gift reveal: do not move or replace the artwork text.
     A wider linked plate covers the full "Restore an' tea" phrase. */
  .restore-gift{
    color:transparent !important;
    padding:0 !important;
    overflow:visible !important;
  }

  .restore-gift::before{
    content:"Restore an' tea" !important;
    position:absolute !important;
    left:0 !important;
    top:0 !important;
    width:100% !important;
    height:100% !important;
    min-width:0 !important;
    min-height:0 !important;
    padding:0 5px !important;
    box-sizing:border-box !important;
    display:flex !important;
    align-items:center !important;
    justify-content:center !important;
    border-radius:4px !important;
    background:rgba(255,255,255,.98) !important;
    color:rgb(84,64,115) !important;
    font-family:"Gabriola","Segoe Print","Bradley Hand",cursive !important;
    font-weight:700 !important;
    line-height:1 !important;
    white-space:nowrap !important;
    opacity:0;
    transform:none !important;
    pointer-events:none;
  }

  .restore-gift:hover::before,
  .restore-gift:focus-visible::before,
  body.show-gift .restore-gift::before{
    opacity:1;
    transform:none !important;
  }

  /* Wider hit areas centred on the existing phrase, without shifting text. */
  .desktop .restore-gift{
    left:28.15% !important;
    top:88.1% !important;
    width:10.2% !important;
    height:5.4% !important;
    font-size:clamp(15px,1.2vw,21px) !important;
  }

  .mrow5 .restore-gift{
    left:54.0% !important;
    top:4% !important;
    width:27.5% !important;
    height:92% !important;
    font-size:17px !important;
  }


  /* Final Restore behaviour:
     - visible link text remains "Restore"
     - its baseline/position is fixed to the original word
     - a wider white mask hides the whole "Restore an' tea" phrase underneath
     - only font size/weight changes on reveal/hover
  */
  .restore-gift{
    overflow:visible !important;
    background:transparent !important;
    box-shadow:none !important;
    color:transparent !important;
  }

  .restore-gift::before{
    content:"" !important;
    position:absolute !important;
    left:0 !important;
    top:0 !important;
    width:100% !important;
    height:100% !important;
    background:rgba(255,255,255,.985) !important;
    border-radius:4px !important;
    opacity:0;
    transform:none !important;
    pointer-events:none;
    z-index:1;
  }

  .restore-gift::after{
    content:"Restore" !important;
    position:absolute !important;
    /* Fixed text anchor — this does not change between states */
    left:6% !important;
    top:50% !important;
    transform:translateY(-50%) !important;
    transform-origin:left center !important;
    color:rgb(84,64,115) !important;
    font-family:"Gabriola","Segoe Print","Bradley Hand",cursive !important;
    font-weight:700 !important;
    line-height:1 !important;
    white-space:nowrap !important;
    opacity:0;
    pointer-events:none;
    z-index:2;
  }

  .restore-gift:hover::before,
  .restore-gift:focus-visible::before,
  body.show-gift .restore-gift::before,
  .restore-gift:hover::after,
  .restore-gift:focus-visible::after,
  body.show-gift .restore-gift::after{
    opacity:1;
  }

  /* Same exact anchor position, only larger/bolder typography when shown */
  .desktop .restore-gift{
    left:28.15% !important;
    top:88.1% !important;
    width:10.2% !important;
    height:5.4% !important;
  }
  .desktop .restore-gift::after{
    font-size:clamp(18px,1.42vw,25px) !important;
  }

  .mrow5 .restore-gift{
    left:54.0% !important;
    top:4% !important;
    width:27.5% !important;
    height:92% !important;
  }
  .mrow5 .restore-gift::after{
    font-size:20px !important;
  }


  /* Restore typography refinement:
     centre horizontally in the full mask/button area,
     align to its bottom edge, and make it larger/heavier. */
  .restore-gift::after{
    left:50% !important;
    top:auto !important;
    bottom:0 !important;
    transform:translateX(-50%) !important;
    transform-origin:center bottom !important;
    text-align:center !important;
    font-weight:900 !important;
    line-height:.88 !important;
  }

  .desktop .restore-gift::after{
    font-size:clamp(22px,1.75vw,31px) !important;
  }

  .mrow5 .restore-gift::after{
    font-size:25px !important;
  }

</style>

<script>
(function(){
  const button = document.getElementById('businessToggle');
  if(!button) return;

  function setShown(shown){
    document.body.classList.toggle('show-businesses', shown);
    button.setAttribute('aria-pressed', shown ? 'true' : 'false');
    button.textContent = shown ? 'Hide Spoilers' : 'Spoilers';
  }

  setShown(false);
  button.addEventListener('click', function(){
    setShown(!document.body.classList.contains('show-businesses'));
  });
})();

(function(){
  const giftButton = document.getElementById('giftToggle');
  if(!giftButton) return;

  function setGiftShown(shown){
    document.body.classList.toggle('show-gift', shown);
    giftButton.setAttribute('aria-pressed', shown ? 'true' : 'false');
    giftButton.textContent = shown ? 'Hide Gift' : 'Gift';
  }

  setGiftShown(false);
  giftButton.addEventListener('click', function(){
    setGiftShown(!document.body.classList.contains('show-gift'));
  });
})();

</script>
